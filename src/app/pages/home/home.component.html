<div class="page-header">
  <div>
    <span class="eyebrow">Dashboard</span>
    <h1>Overview</h1>
  </div>
</div>

<div class="banner banner-error" *ngIf="error">{{ error }}</div>
<div class="loading-note" *ngIf="loading && !error">Loading records…</div>

<div class="dashboard-grid" *ngIf="!loading || error">
  <a
    class="dashboard-tile"
    *ngFor="let t of tiles"
    [routerLink]="t.path"
  >
    <span class="tile-icon">
      <svg class="icon" viewBox="0 0 256 256" fill="currentColor">
        <path [attr.d]="t.icon"/>
      </svg>
    </span>
    <span class="tile-no mono">{{ t.no }}</span>
    <h3>{{ t.label }}</h3>
    <p class="tile-desc">{{ t.desc }}</p>
    <span class="tile-count">{{ t.count === null ? '—' : t.count }}</span>
  </a>
</div>
