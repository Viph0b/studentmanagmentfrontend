<div class="page-header">
  <div>
    <span class="eyebrow">Register · 08</span>
    <h1>Subjects</h1>
  </div>
  <div class="tally">
    <span>courses</span>
    <b>{{ total }}</b>
  </div>
</div>

<div class="banner banner-error" *ngIf="error">{{ error }}</div>

<div class="card form-panel" *ngIf="showForm">
  <h2>{{ editingId === null ? "Add a subject" : "Edit subject #" + editingId }}</h2>

  <div class="banner banner-error" *ngIf="formError">{{ formError }}</div>

  <form (ngSubmit)="save()">
    <div class="form-grid">
      <div class="field span-2">
        <label for="subjectName">Subject name</label>
        <input
          id="subjectName"
          name="subjectName"
          type="text"
          [(ngModel)]="draft.subjectName"
          placeholder="e.g. Data Structure"
          required
        />
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="saving">
        {{ saving ? "Saving…" : editingId === null ? "Add subject" : "Save changes" }}
      </button>
      <button type="button" class="btn btn-ghost" (click)="cancelForm()">
        Cancel
      </button>
    </div>
  </form>
</div>

<div class="toolbar" *ngIf="!showForm">
  <div class="search-wrap">
    <input
      type="text"
      placeholder="Search by subject name…"
      [(ngModel)]="search"
      (ngModelChange)="onSearch()"
      name="search"
    />
    <button class="search-clear" *ngIf="search" (click)="search = ''" aria-label="Clear search">
      <app-icon name="close"></app-icon>
    </button>
  </div>
  <button class="btn btn-primary" (click)="openCreate()">+ Add subject</button>
</div>

<div class="loading-note" *ngIf="loading">Loading subjects…</div>

<div class="card table-wrap" *ngIf="!loading && !showForm">
  <table class="data-table">
    <thead>
      <tr>
        <th
          class="sortable"
          [class.sort-asc]="sortKey === 'subjectId' && sortDir === 'asc'"
          [class.sort-desc]="sortKey === 'subjectId' && sortDir === 'desc'"
          (click)="toggleSort('subjectId')"
        >
          Subject ID
        </th>
        <th
          class="sortable"
          [class.sort-asc]="sortKey === 'subjectName' && sortDir === 'asc'"
          [class.sort-desc]="sortKey === 'subjectName' && sortDir === 'desc'"
          (click)="toggleSort('subjectName')"
        >
          Subject
        </th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let s of subjects; trackBy: trackBySubjectId">
        <td class="mono">{{ s.subjectId }}</td>
        <td>{{ s.subjectName }}</td>
        <td>
          <div class="row-actions">
            <button class="btn btn-ghost btn-sm" (click)="openEdit(s)">
              Edit
            </button>
            <button class="btn btn-danger btn-sm" (click)="remove(s)">
              Delete
            </button>
          </div>
        </td>
      </tr>
      <tr *ngIf="subjects.length === 0">
        <td colspan="3" class="empty-state">No subjects match this search.</td>
      </tr>
    </tbody>
  </table>
  <app-pager
    [page]="page"
    [totalPages]="totalPages"
    [total]="total"
    [pageSize]="pageSize"
    (pageChange)="goToPage($event)"
    (pageSizeChange)="changePageSize($event)"
  ></app-pager>
</div>
