<button
  class="hamburger"
  (click)="toggleSidebar()"
  aria-label="Toggle navigation"
>
  <app-icon *ngIf="!sidebarOpen" name="menu"></app-icon>
  <app-icon *ngIf="sidebarOpen" name="close"></app-icon>
</button>

<div
  class="sidebar-backdrop"
  [class.open]="sidebarOpen"
  (click)="closeSidebar()"
></div>

<div class="app-shell">
  <aside class="sidebar" [class.open]="sidebarOpen">
    <a class="sidebar-header" routerLink="/" (click)="closeSidebar()">
      <div class="brand">
        <span class="brand-icon">
          <app-icon name="home"></app-icon>
        </span>
        School Management
      </div>
      <div class="sub">Administration Portal</div>
    </a>
    <ul class="sidebar-nav">
      <li *ngFor="let item of navItems; trackBy: trackByPath">
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          (click)="closeSidebar()"
        >
          <span class="nav-icon">
            <svg class="icon" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
              <path [attr.d]="item.icon" />
            </svg>
          </span>
          <span class="nav-label">{{ item.label }}</span>
          <span class="nav-badge">{{ item.no }}</span>
        </a>
      </li>
    </ul>
    <div class="sidebar-footer">API · localhost:5073</div>
  </aside>

  <main class="canvas" (click)="closeSidebar()">
    <div class="page-wrap" [@routeAnimations]="getRouteAnimation(routerOutlet)">
      <router-outlet #routerOutlet="outlet"></router-outlet>
    </div>
  </main>
</div>

<div class="toast-container" *ngIf="toasts.length > 0">
  <div
    class="toast"
    [class.toast-success]="t.type === 'success'"
    [class.toast-error]="t.type === 'error'"
    [class.toast-info]="t.type === 'info'"
    *ngFor="let t of toasts; trackBy: trackByToastId"
  >
    <span>{{ t.message }}</span>
    <button class="toast-close" (click)="dismissToast(t.id)" aria-label="Dismiss">
      <app-icon name="close"></app-icon>
    </button>
  </div>
</div>

<div class="modal-overlay" *ngIf="confirm" (click)="onConfirm(false)">
  <div class="modal-dialog" (click)="$event.stopPropagation()">
    <h3>{{ confirm.title }}</h3>
    <p>{{ confirm.message }}</p>
    <div class="modal-actions">
      <button class="btn" (click)="onConfirm(false)">
        {{ confirm.cancelLabel || "Cancel" }}
      </button>
      <button
        class="btn"
        [class.btn-danger]="confirm.danger"
        [class.btn-primary]="!confirm.danger"
        (click)="onConfirm(true)"
      >
        {{ confirm.confirmLabel || "Confirm" }}
      </button>
    </div>
  </div>
</div>
